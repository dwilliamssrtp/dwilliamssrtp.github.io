<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specialty RTP</title>
<meta name="description" content="Internal tools for Specialty RTP.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9881;</text></svg>">
<style>
/* Same palette as the pricing tool, so the suite reads as one system. */
:root{
  --bg:#0f1318; --bg2:#151b22; --card:#1a222b; --card2:#202a35;
  --line:#2b3744; --line2:#3a4855;
  --ink:#e8edf2; --ink2:#a3b1be; --ink3:#6f7f8d;
  --accent:#00a99d;
  --sans:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f4; --bg2:#e4e9ee; --card:#fff; --card2:#f5f7f9;
    --line:#d4dbe2; --line2:#bcc7d1;
    --ink:#16202a; --ink2:#4d5e6e; --ink3:#7b8b99; --accent:#00827a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
header{text-align:center;margin-bottom:34px}
h1{margin:0;font-size:26px;letter-spacing:.2px}
header p{margin:6px 0 0;color:var(--ink3);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.16em}
.apps{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  width:100%;max-width:720px}
a.app{display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:24px 22px;
  transition:border-color .14s ease, transform .14s ease, background .14s ease}
a.app:hover,a.app:focus-visible{border-color:var(--accent);background:var(--card2);
  transform:translateY(-2px);outline:none}
a.app:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 16%,var(--card2));
  border:1px solid color-mix(in srgb,var(--accent) 38%,var(--line));margin-bottom:14px}
.ic svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
a.app b{display:block;font-size:17px;font-weight:600;letter-spacing:.1px}
a.app span{display:block;margin-top:5px;color:var(--ink2);font-size:13.5px;line-height:1.45}
footer{margin-top:34px;color:var(--ink3);font-size:11.5px;font-family:var(--mono)}
</style>
</head>
<body>
  <header>
    <h1>Specialty RTP</h1>
    <p>Internal tools</p>
  </header>

  <main class="apps">
    <a class="app" href="/srtp-pricing-tool/">
      <div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24">
        <path d="M4 19V5m0 14h16M8 15V9m4 6V7m4 8v-4"/></svg></div>
      <b>Pricing Tool</b>
      <span>Design pipe, check it against the rules, and build a quote or a datasheet.</span>
    </a>

    <a class="app" href="/Production-Tracker/">
      <div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18.5" cy="17" r="2.2"/></svg></div>
      <b>Production Tracker</b>
      <span>Work orders, reels and QC readings from the floor.</span>
    </a>
  </main>

  <footer>Each app signs you in separately.</footer>
</body>
</html>
